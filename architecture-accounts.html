<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP System - Design Crew</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: #f4f6f9; color: #222; }

  /* ---------- Login Screen ---------- */
  #loginScreen {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1f2937, #111827);
  }
  .login-box {
    background: #fff; padding: 40px 35px; border-radius: 12px;
    width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .login-box h1 { font-size: 22px; margin-bottom: 5px; color: #111827; }
  .login-box p { font-size: 13px; color: #6b7280; margin-bottom: 25px; }
  .login-box input {
    width: 100%; padding: 12px; margin-bottom: 14px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 14px;
  }
  .login-box button {
    width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 600;
  }
  .login-box button:hover { background: #1d4ed8; }
  .toggle-link { text-align: center; margin-top: 14px; font-size: 13px; color: #2563eb; cursor: pointer; }
  #loginError { color: #dc2626; font-size: 13px; margin-bottom: 10px; min-height: 16px; }

  /* ---------- Dashboard ---------- */
  #dashboard { display: none; }
  header {
    background: #111827; color: #fff; padding: 16px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h2 { font-size: 18px; }
  header button {
    background: #ef4444; color: #fff; border: none; padding: 8px 16px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }

  .container { padding: 24px; max-width: 900px; margin: 0 auto; }

  .card {
    background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card h3 { margin-bottom: 14px; font-size: 16px; color: #111827; }

  .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .form-row input {
    flex: 1; min-width: 150px; padding: 10px; border: 1px solid #d1d5db;
    border-radius: 6px; font-size: 14px;
  }
  .form-row button {
    background: #16a34a; color: #fff; border: none; padding: 10px 18px;
    border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  .form-row button:hover { background: #15803d; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
  th { color: #6b7280; font-weight: 600; }
  .delete-btn { color: #dc2626; cursor: pointer; font-size: 13px; }

  .empty-msg { color: #9ca3af; font-size: 13px; padding: 10px 0; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>ERP System</h1>
    <p id="modeText">Apne account mein login karein</p>
    <div id="loginError"></div>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="actionBtn" onclick="handleLogin()">Login</button>
    <div class="toggle-link" onclick="toggleMode()" id="toggleLink">Naya account banana hai? Sign up</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <h2>ERP Dashboard</h2>
    <button onclick="logout()">Logout</button>
  </header>

  <div class="container">
    <div class="card">
      <h3>Naya Record Add Karein</h3>
      <div class="form-row">
        <input type="text" id="recName" placeholder="Naam" />
        <input type="text" id="recDetail" placeholder="Tafseel / Detail" />
        <input type="number" id="recAmount" placeholder="Amount" />
        <button onclick="addRecord()">Add Karein</button>
      </div>
    </div>

    <div class="card">
      <h3>Sare Records</h3>
      <table>
        <thead>
          <tr><th>Naam</th><th>Detail</th><th>Amount</th><th></th></tr>
        </thead>
        <tbody id="recordsBody"></tbody>
      </table>
      <div id="emptyMsg" class="empty-msg">Abhi koi record nahi hai.</div>
    </div>
  </div>
</div>

<script>
  // ---- Firebase Config ----
  const firebaseConfig = {
    apiKey: "AIzaSyABOOSeCoViUjyciNJ1Yt_6r19GqD7-IQA",
    authDomain: "the-design-crew.firebaseapp.com",
    projectId: "the-design-crew",
    storageBucket: "the-design-crew.firebasestorage.app",
    messagingSenderId: "376539007773",
    appId: "1:376539007773:web:7cce8750a01b716fda2ff4"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let isSignup = false;

  function toggleMode() {
    isSignup = !isSignup;
    document.getElementById('actionBtn').innerText = isSignup ? 'Sign Up' : 'Login';
    document.getElementById('actionBtn').setAttribute('onclick', isSignup ? 'handleSignup()' : 'handleLogin()');
    document.getElementById('toggleLink').innerText = isSignup ? 'Pehle se account hai? Login' : 'Naya account banana hai? Sign up';
    document.getElementById('modeText').innerText = isSignup ? 'Naya account banayein' : 'Apne account mein login karein';
    document.getElementById('loginError').innerText = '';
  }

  function handleSignup() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    document.getElementById('loginError').innerText = '';
    auth.createUserWithEmailAndPassword(email, password)
      .catch(err => { document.getElementById('loginError').innerText = err.message; });
  }

  function handleLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    document.getElementById('loginError').innerText = '';
    auth.signInWithEmailAndPassword(email, password)
      .catch(err => { document.getElementById('loginError').innerText = err.message; });
  }

  function logout() {
    auth.signOut();
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadRecords();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('dashboard').style.display = 'none';
    }
  });

  function addRecord() {
    const name = document.getElementById('recName').value.trim();
    const detail = document.getElementById('recDetail').value.trim();
    const amount = document.getElementById('recAmount').value;

    if (!name) { alert('Naam zaroori hai'); return; }

    db.collection('records').add({
      name: name,
      detail: detail,
      amount: amount || 0,
      createdAt: new Date()
    }).then(() => {
      document.getElementById('recName').value = '';
      document.getElementById('recDetail').value = '';
      document.getElementById('recAmount').value = '';
    });
  }

  function deleteRecord(id) {
    db.collection('records').doc(id).delete();
  }

  function loadRecords() {
    db.collection('records').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
      const body = document.getElementById('recordsBody');
      const emptyMsg = document.getElementById('emptyMsg');
      body.innerHTML = '';

      if (snapshot.empty) {
        emptyMsg.style.display = 'block';
        return;
      }
      emptyMsg.style.display = 'none';

      snapshot.forEach(doc => {
        const d = doc.data();
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${d.name}</td>
          <td>${d.detail || ''}</td>
          <td>${d.amount || 0}</td>
          <td><span class="delete-btn" onclick="deleteRecord('${doc.id}')">Delete</span></td>
        `;
        body.appendChild(row);
      });
    });
  }
</script>

</body>
</html>
